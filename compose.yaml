services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://novellia:novellia_local_only@db:5432/novellia_pets
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - '0.0.0.0:3017:3017'
    depends_on:
      db:
        condition: service_healthy
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3017/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20
  studio:
    build: .
    profiles: ['tools']
    network_mode: host
    env_file: .env
    volumes:
      - ./.env:/app/.env:ro
      - ./prisma.config.ts:/app/prisma.config.ts:ro
    command: ['npm', 'exec', 'prisma', '--', 'studio', '--browser', 'none', '--port', '5555']
    init: true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5555/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: novellia
      POSTGRES_PASSWORD: novellia_local_only
      POSTGRES_DB: novellia_pets
    ports:
      - '127.0.0.1:55437:5432'
    volumes:
      - pets_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U novellia -d novellia_pets']
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  pets_data:
