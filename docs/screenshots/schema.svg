<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1130" viewBox="0 0 1540 1130"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b5452c"/></marker></defs><rect width="1540" height="1130" fill="#fffaf7"/><text x="40" y="53" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#500014">Pets · PostgreSQL schema</text><text x="40" y="85" font-family="DejaVu Sans" font-size="17" fill="#75666a">8 application tables · PK primary key · FK foreign key · ? optional value · arrow points to dependent rows</text><path d="M485 225H540" fill="none" stroke="#b5452c" stroke-width="2" marker-end="url(#arrow)" /><text x="490" y="205" font-family="DejaVu Sans" font-size="11" fill="#75666a">owns</text><path d="M990 225H1045" fill="none" stroke="#b5452c" stroke-width="2" marker-end="url(#arrow)" /><text x="995" y="205" font-family="DejaVu Sans" font-size="11" fill="#75666a">has</text><path d="M260 395V460" fill="none" stroke="#b5452c" stroke-width="2" marker-end="url(#arrow)" /><text x="273" y="433" font-family="DejaVu Sans" font-size="11" fill="#75666a">sessions</text><path d="M765 395V460" fill="none" stroke="#b5452c" stroke-width="2" marker-end="url(#arrow)" /><text x="778" y="433" font-family="DejaVu Sans" font-size="11" fill="#75666a">plans</text><path d="M545 260H515V940H540" fill="none" stroke="#b5452c" stroke-width="2" marker-end="url(#arrow)" /><text x="474" y="743" font-family="DejaVu Sans" font-size="11" fill="#75666a">logs</text><path d="M1190 395V460" fill="none" stroke="#b5452c" stroke-width="2" marker-end="url(#arrow)" /><text x="1060" y="433" font-family="DejaVu Sans" font-size="11" fill="#75666a">attachments: optional record</text><path d="M940 395V430H1030V575H1045" fill="none" stroke="#b5452c" stroke-width="2" marker-end="url(#arrow)" /><text x="918" y="417" font-family="DejaVu Sans" font-size="11" fill="#75666a">pet files</text><rect x="40" y="125" width="445" height="270" rx="16" fill="white" stroke="#eeded8"/><path d="M56 125H469Q485 125 485 141V187H40V141Q40 125 56 125" fill="#fff0e5"/><text x="62" y="165" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#500014">User</text><text x="62" y="219" font-family="DejaVu Sans" font-size="15" fill="#302529">PK id · UUID text</text><text x="62" y="246" font-family="DejaVu Sans" font-size="15" fill="#302529">UNIQUE email, analyticsId</text><text x="62" y="273" font-family="DejaVu Sans" font-size="15" fill="#302529">name · role · isSynthetic</text><text x="62" y="300" font-family="DejaVu Sans" font-size="15" fill="#302529">createdAt · updatedAt</text><text x="62" y="372" font-family="DejaVu Sans" font-size="13" fill="#b5452c">Account ownership</text><rect x="545" y="125" width="445" height="270" rx="16" fill="white" stroke="#eeded8"/><path d="M561 125H974Q990 125 990 141V187H545V141Q545 125 561 125" fill="#fff0e5"/><text x="567" y="165" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#500014">Pet</text><text x="567" y="219" font-family="DejaVu Sans" font-size="15" fill="#302529">PK id · CUID</text><text x="567" y="246" font-family="DejaVu Sans" font-size="15" fill="#302529">FK ownerId → User.id</text><text x="567" y="273" font-family="DejaVu Sans" font-size="15" fill="#302529">name · species · breed? · birthDate?</text><text x="567" y="300" font-family="DejaVu Sans" font-size="15" fill="#302529">photoUrl? · care essentials</text><text x="567" y="327" font-family="DejaVu Sans" font-size="15" fill="#302529">createdAt · updatedAt</text><text x="567" y="372" font-family="DejaVu Sans" font-size="13" fill="#b5452c">Owner-scoped profile</text><rect x="1050" y="125" width="445" height="270" rx="16" fill="white" stroke="#eeded8"/><path d="M1066 125H1479Q1495 125 1495 141V187H1050V141Q1050 125 1066 125" fill="#fff0e5"/><text x="1072" y="165" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#500014">MedicalRecord</text><text x="1072" y="219" font-family="DejaVu Sans" font-size="15" fill="#302529">PK id · CUID</text><text x="1072" y="246" font-family="DejaVu Sans" font-size="15" fill="#302529">FK petId → Pet.id</text><text x="1072" y="273" font-family="DejaVu Sans" font-size="15" fill="#302529">category · title · date · provider?</text><text x="1072" y="300" font-family="DejaVu Sans" font-size="15" fill="#302529">notes? · sourceDocumentId?</text><text x="1072" y="327" font-family="DejaVu Sans" font-size="15" fill="#302529">sourcePage? · sourceQuote?</text><text x="1072" y="372" font-family="DejaVu Sans" font-size="13" fill="#b5452c">Clinical history</text><rect x="40" y="465" width="445" height="270" rx="16" fill="white" stroke="#eeded8"/><path d="M56 465H469Q485 465 485 481V527H40V481Q40 465 56 465" fill="#fff0e5"/><text x="62" y="505" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#500014">EmailSession</text><text x="62" y="559" font-family="DejaVu Sans" font-size="15" fill="#302529">PK id · CUID</text><text x="62" y="586" font-family="DejaVu Sans" font-size="15" fill="#302529">FK userId → User.id</text><text x="62" y="613" font-family="DejaVu Sans" font-size="15" fill="#302529">UNIQUE tokenHash</text><text x="62" y="640" font-family="DejaVu Sans" font-size="15" fill="#302529">expiresAt · createdAt</text><text x="62" y="712" font-family="DejaVu Sans" font-size="13" fill="#b5452c">Cascade with account</text><rect x="545" y="465" width="445" height="270" rx="16" fill="white" stroke="#eeded8"/><path d="M561 465H974Q990 465 990 481V527H545V481Q545 465 561 465" fill="#fff0e5"/><text x="567" y="505" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#500014">MedicationPlan</text><text x="567" y="559" font-family="DejaVu Sans" font-size="15" fill="#302529">PK id · CUID</text><text x="567" y="586" font-family="DejaVu Sans" font-size="15" fill="#302529">FK petId → Pet.id</text><text x="567" y="613" font-family="DejaVu Sans" font-size="15" fill="#302529">name · dose · frequency</text><text x="567" y="640" font-family="DejaVu Sans" font-size="15" fill="#302529">instructions? · createdAt</text><text x="567" y="712" font-family="DejaVu Sans" font-size="13" fill="#b5452c">Cascade with pet</text><rect x="1050" y="465" width="445" height="270" rx="16" fill="white" stroke="#eeded8"/><path d="M1066 465H1479Q1495 465 1495 481V527H1050V481Q1050 465 1066 465" fill="#fff0e5"/><text x="1072" y="505" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#500014">PetMedia</text><text x="1072" y="559" font-family="DejaVu Sans" font-size="15" fill="#302529">PK id · CUID</text><text x="1072" y="586" font-family="DejaVu Sans" font-size="15" fill="#302529">FK petId → Pet.id</text><text x="1072" y="613" font-family="DejaVu Sans" font-size="15" fill="#302529">FK recordId? → MedicalRecord.id</text><text x="1072" y="640" font-family="DejaVu Sans" font-size="15" fill="#302529">kind · name · mime · data</text><text x="1072" y="667" font-family="DejaVu Sans" font-size="15" fill="#302529">createdAt</text><text x="1072" y="712" font-family="DejaVu Sans" font-size="13" fill="#b5452c">Private file bytes</text><rect x="40" y="805" width="445" height="270" rx="16" fill="white" stroke="#eeded8"/><path d="M56 805H469Q485 805 485 821V867H40V821Q40 805 56 805" fill="#fff0e5"/><text x="62" y="845" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#500014">OperationalEvent</text><text x="62" y="899" font-family="DejaVu Sans" font-size="15" fill="#302529">PK id · CUID</text><text x="62" y="926" font-family="DejaVu Sans" font-size="15" fill="#302529">kind · actorId? · createdAt</text><text x="62" y="953" font-family="DejaVu Sans" font-size="15" fill="#302529">actorId has NO foreign key</text><text x="62" y="980" font-family="DejaVu Sans" font-size="15" fill="#302529">Historical events can remain</text><text x="62" y="1052" font-family="DejaVu Sans" font-size="13" fill="#b5452c">Minimal event tracking</text><rect x="545" y="805" width="445" height="270" rx="16" fill="white" stroke="#eeded8"/><path d="M561 805H974Q990 805 990 821V867H545V821Q545 805 561 805" fill="#fff0e5"/><text x="567" y="845" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#500014">CareLog</text><text x="567" y="899" font-family="DejaVu Sans" font-size="15" fill="#302529">PK id · CUID</text><text x="567" y="926" font-family="DejaVu Sans" font-size="15" fill="#302529">FK petId → Pet.id</text><text x="567" y="953" font-family="DejaVu Sans" font-size="15" fill="#302529">date · weightKg? · observation?</text><text x="567" y="980" font-family="DejaVu Sans" font-size="15" fill="#302529">createdAt</text><text x="567" y="1052" font-family="DejaVu Sans" font-size="13" fill="#b5452c">Cascade with pet</text><rect x="1050" y="805" width="445" height="270" rx="16" fill="#500014"/><text x="1074" y="846" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="white">Two document relationships</text><text x="1074" y="884" font-family="DejaVu Sans" font-size="15" fill="#fff0e5">recordId: a file attached to one record.</text><text x="1074" y="921" font-family="DejaVu Sans" font-size="15" fill="#fff0e5">sourceDocumentId: a retained source</text><text x="1074" y="944" font-family="DejaVu Sans" font-size="15" fill="#fff0e5">that may support several records.</text><text x="1074" y="982" font-family="DejaVu Sans" font-size="15" fill="#fff0e5">Deleting the source sets its link to null;</text><text x="1074" y="1005" font-family="DejaVu Sans" font-size="15" fill="#fff0e5">the medical record stays.</text><text x="40" y="1110" font-family="DejaVu Sans" font-size="14" fill="#75666a">Full fields, indexes, cascade rules, and validation boundaries are explained in README.md. No reminder or AI tables remain.</text></svg>